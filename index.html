<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dupe Finder</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#241b17;--mu:#7a6c64;--ac:#b5543a;--ac2:#f3e2da;--bd:#eadfd6}
@media (prefers-color-scheme:dark){:root{--bg:#171210;--card:#231c19;--tx:#f5ece6;--mu:#a89990;--ac:#e0795c;--ac2:#3a2620;--bd:#352b26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:22px 14px 40px}
h1{font-family:Georgia,serif;font-size:28px;margin:0 0 16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:600 15px system-ui,sans-serif;border:0;border-radius:14px;padding:14px;background:var(--ac);color:#fff;cursor:pointer}
button.alt{background:var(--ac2);color:var(--ac)}
#prev{display:none;width:100%;max-height:240px;object-fit:contain;margin:16px 0 0;border-radius:16px;background:var(--card);border:1px solid var(--bd)}
#st{text-align:center;color:var(--mu);font-size:14px;margin:14px 0}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
a.it{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--tx);display:flex;flex-direction:column}
a.it img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--ac2)}
.in{padding:9px 10px 11px}
.t{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p{font-weight:700;color:var(--ac);margin-top:5px}
.s{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>Dupe Finder 👜</h1>
<div class="btns">
  <button id="bG">🖼️ Galerie</button>
  <button id="bC" class="alt">📷 Photo</button>
</div>
<input id="fG" type="file" accept="image/*" hidden>
<input id="fC" type="file" accept="image/*" capture="environment" hidden>
<img id="prev" alt="">
<div id="st"></div>
<div id="grid"></div>
</main>
<script>
/* ====== À REMPLIR (une seule fois) ====== */
const ANTHROPIC_KEY = "";  // https://console.anthropic.com  (reconnaît le sac)
const SERPAPI_KEY   = "";  // https://serpapi.com           (trouve les vrais produits, images et liens)
/* ======================================== */

const $=id=>document.getElementById(id);
$('bG').onclick=()=>$('fG').click();
$('bC').onclick=()=>$('fC').click();
$('fG').onchange=$('fC').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)go(f)};

function shrink(file){return new Promise((ok,ko)=>{
  const im=new Image();
  im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};
  im.onerror=ko;im.src=URL.createObjectURL(file)})}

async function go(file){
  $('grid').innerHTML='';
  if(!ANTHROPIC_KEY||!SERPAPI_KEY){$('st').textContent='Ajoute tes 2 clés au début du fichier index.html.';return}
  try{
    $('st').textContent='Analyse du sac…';
    const url=await shrink(file);$('prev').src=url;$('prev').style.display='block';
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:300,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:url.split(',')[1]}},
        {type:'text',text:'Identifie ce sac. Réponds uniquement en JSON : {"query":"requête shopping en français pour trouver des sacs très similaires (forme, couleur, matière, sans nom de marque de luxe)","max":prix maximum conseillé en euros pour un dupe (nombre)}'}]}]})});
    const j=await r.json();
    const info=JSON.parse(j.content[0].text.replace(/```json|```/g,'').trim());
    $('st').textContent='Recherche des alternatives…';
    const q=new URLSearchParams({engine:'google_shopping',q:info.query,gl:'fr',hl:'fr',api_key:SERPAPI_KEY});
    const s=await (await fetch('https://serpapi.com/search.json?'+q)).json();
    const max=info.max||60;
    const items=(s.shopping_results||[]).filter(x=>x.thumbnail&&(x.link||x.product_link)&&(!x.extracted_price||x.extracted_price<=max))
      .sort((a,b)=>(a.extracted_price||999)-(b.extracted_price||999)).slice(0,12);
    if(!items.length){$('st').textContent='Aucun résultat, essaie une autre photo.';return}
    $('st').textContent='';
    $('grid').innerHTML=items.map(x=>`<a class="it" target="_blank" rel="noopener" href="${x.link||x.product_link}">
      <img src="${x.thumbnail}" alt="" loading="lazy"><div class="in"><div class="t"></div><div class="p">${x.price||''}</div><div class="s">${x.source||''}</div></div></a>`).join('');
    [...document.querySelectorAll('.t')].forEach((el,i)=>el.textContent=items[i].title);
  }catch(e){$('st').textContent='Erreur : vérifie tes clés ou réessaie.'}
}
</script>
</body>
</html>
